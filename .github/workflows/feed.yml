# DROP THE DECK — L2 broadcast publisher (bible §11.2, §11.10).
# Copy this file to .github/workflows/feed.yml in a SEPARATE public repository that serves GitHub Pages (Settings > Pages:
# "GitHub Actions"). Every 10 minutes it pulls the Crossfade server's rendered feeds and publishes them with
# config.json, so every instance can read them from a TRUSTED *.github.io URL without enabling untrusted URLs.
# The server holds no GitHub token: this workflow pulls.
#
# Repository variable (Settings > Secrets and variables > Actions > Variables):
#   DTD_API   https://api.<your-domain>    (the Crossfade server's base URL)
name: feed
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write   # only for the unstick commit below
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Pull the feeds
        run: |
          set -euo pipefail
          mkdir -p site
          cp feed/config.json site/config.json
          for f in charts.json charts.png ghosts.json season.json ticker.json rush.json codes.txt; do
            curl -fsS --max-time 30 "${{ vars.DTD_API }}/l2/$f" -o "site/$f.tmp"
            mv "site/$f.tmp" "site/$f"
          done
          # the sponsor ad rotation (the website's world feed): the world's AdScreens read ads.txt + ads.jpg from here
          for f in ads.txt ads.jpg; do
            curl -fsS --max-time 30 "${{ vars.DTD_WEB }}/api/world/$f" -o "site/$f.tmp"
            mv "site/$f.tmp" "site/$f"
          done
          # iOS truncates responses over ~800 KB (bible §11.1)
          find site -type f -size +780k -print -exec false {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      # GitHub Pages sometimes stops publishing repeated deploys of the same commit (the copy froze for hours on
      # 11-05 and 11-08 while every run said success). If the live copy is over 45 min old, add an empty commit so
      # the next run deploys a new version.
      - name: Unstick Pages
        if: always()
        run: |
          sleep 30
          upd=$(curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/season.json?t=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin)['updatedMs'])" || echo 0)
          age=$(( $(date +%s) - upd / 1000 ))
          echo "live copy age: ${age}s"
          if [ "$age" -gt 2700 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Feed: nudge Pages (live copy ${age}s old)"
            git push origin HEAD:main || true
          fi
